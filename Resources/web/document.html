<!DOCTYPE html><html lang="zh"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src reader-asset: data:; base-uri 'none'; form-action 'none'">
<style>
:root{color-scheme:light dark;--ink:#272e2b;--paper:#fffefa;--rule:#d9dfd9;--muted:#63726b}
@media(prefers-color-scheme:dark){:root{--ink:#e8ece6;--paper:#252926;--rule:#474f48;--muted:#abb9af}}
*{box-sizing:border-box}body{background:var(--paper);color:var(--ink);margin:0}article{max-width:820px;margin:0 auto;padding:48px clamp(22px,6vw,76px) 90px;font:17px/1.72 ui-serif,Georgia,"Songti SC",serif;overflow-wrap:anywhere}
h1,h2,h3,h4{line-height:1.3;margin:1.1em 0 .55em;font-family:-apple-system,sans-serif;letter-spacing:-.025em}h1{font-size:1.95em}h2{font-size:1.5em}p{margin:.8em 0}article>:first-child{margin-top:0}
code,pre{font: .88em/1.5 ui-monospace,Menlo,monospace;background:#71857818}pre{overflow:auto;padding:14px;border-radius:6px}pre code{background:none}a{color:inherit;text-decoration-color:var(--muted)}blockquote{border-left:3px solid var(--rule);margin-left:0;padding-left:1em;color:var(--muted)}img{max-width:100%}table{border-collapse:collapse}td,th{border:1px solid var(--rule);padding:5px 9px}::selection{background:#67ad8e55}
.wy-highlight{background:#f5cd51a0;color:inherit}.wy-underline{text-decoration:underline #398cbe 2px;text-underline-offset:.17em}.wy-strike{text-decoration:line-through #c86663 2px}.wy-underline.wy-strike{text-decoration-line:underline line-through}
::highlight(hy-find){background:#f5cd5180;color:inherit}::highlight(hy-find-current){background:#ef963eb0;color:inherit}
</style><article id="paper"></article><script src="marked.js"></script><script src="purify.js"></script><script src="document.js"></script><script src="margins.js"></script><script src="navigation.js"></script></html>
